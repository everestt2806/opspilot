appId: vn.opspilot.desktop
productName: OpsPilot
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
extraResources:
  - from: resources/controller-releases
    to: controller-releases
    filter:
      - '**/*'
  - from: src/main/controlPlane
    to: product-target
    filter:
      - target_execution_guard.py
      - target_guarded_ssh_helper.py
      - target_product_runtime.py
  - from: ../ml-service
    to: ml-service
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/.pytest_cache/**'
      - '!state/**'
  - from: ../templates
    to: templates
    filter:
      - '**/*'
  - from: ../collector
    to: collector
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/.pytest_cache/**'
npmRebuild: false
beforePack: ./scripts/controller-installer-before-pack.cjs
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
  executableName: OpsPilot
nsis:
  artifactName: OpsPilot-${version}-setup.${ext}
  shortcutName: OpsPilot
  uninstallDisplayName: OpsPilot
  createDesktopShortcut: always
