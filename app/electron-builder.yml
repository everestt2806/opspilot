appId: vn.deploytool.desktop
productName: DeployTool
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
extraResources:
  - from: ../ml-service
    to: ml-service
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/.pytest_cache/**'
      - '!state/**'
  - from: ../templates
    to: templates
    filter:
      - '**/*'
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: DeployTool
nsis:
  artifactName: DeployTool-${version}-setup.${ext}
  shortcutName: DeployTool
  uninstallDisplayName: DeployTool
  createDesktopShortcut: always
