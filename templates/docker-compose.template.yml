services:
  app:
    image: {{IMAGE_TAG}}
    container_name: {{APP_NAME}}-app
    ports:
      - "{{HOST_PORT}}:{{CONTAINER_PORT}}"
    env_file:
      - .env
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:{{CONTAINER_PORT}}{{HEALTHCHECK_PATH}} || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
{{EXTRA_SERVICES}}